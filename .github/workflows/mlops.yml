name: MLOps Pipeline

env:
  # Nguong mentor chap nhan cho bo du lieu cua bai lab.
  EVAL_THRESHOLD: "0.68"

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # AWS credentials duoc lay tu GitHub Secrets, khong ghi truc tiep vao repo.
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        # DVC se lay cac CSV tu remote S3 theo cac file .dvc trong repo.
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python - <<'EOF'
          import json
          import os
          from pathlib import Path

          metrics = json.loads(Path("outputs/metrics.json").read_text())
          accuracy = float(metrics["accuracy"])
          print(f"Training accuracy: {accuracy:.6f}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"accuracy={accuracy}\n")
          EOF

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          region = os.environ["AWS_DEFAULT_REGION"]
          client = boto3.client("s3", region_name=region)
          client.upload_file(
              "models/model.pkl",
              bucket,
              "models/latest/model.pkl",
          )
          client.upload_file(
              "outputs/metrics.json",
              bucket,
              "metrics/latest.json",
          )
          print(f"Uploaded model and metrics to s3://{bucket}/")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= EVAL_THRESHOLD).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import os

          accuracy = float("${{ needs.train.outputs.accuracy }}")
          threshold = float(os.environ["EVAL_THRESHOLD"])
          if accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {accuracy:.4f} < {threshold:.2f}. Huy deploy."
              )
          print(f"PASSED: accuracy {accuracy:.4f} >= {threshold:.2f}")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for API (attempt $attempt/5)..."
              sleep 5
            done
            echo "Health check failed."
            sudo systemctl status mlops-serve --no-pager || true
            exit 1
